<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Echo Chamber AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>The Echo Chamber AI</h1>
            <p>An AI that processes inputs through an internal thought process before responding</p>
        </header>
        
        <div class="main-interface">
            <div class="user-input-section">
                <h2>Your Message</h2>
                <textarea id="user-input" placeholder="Type your message here..."></textarea>
                <button id="submit-btn">Submit</button>
            </div>
            
            <div class="ai-processing-section">
                <h2>AI Internal Thought Process</h2>
                <div id="thought-process-container">
                    <div class="thought-stream" id="thought-stream"></div>
                    <div id="image-thoughts"></div>
                </div>
                <div class="thinking-indicator">
                    <div class="dot dot1"></div>
                    <div class="dot dot2"></div>
                    <div class="dot dot3"></div>
                </div>
            </div>
            
            <div class="ai-response-section">
                <h2>AI Response</h2>
                <div id="ai-response"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
